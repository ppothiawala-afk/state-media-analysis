# WEEKLY rollup — classify the archive, append a coverage snapshot, verify.
# Reads the archive only; never fetches. Also runs a feed health check that
# PROPOSES registry changes.
#
# RESILIENCE: the snapshot + verification report are committed even when
# verification FAILS. A failed check reds the build (final gate step) so it is
# visible, but it never again silently discards a week of history — the failure
# mode that hid a false-positive dead-feed check for weeks.
name: rollup
on:
  schedule:
    - cron: "40 11 * * 1"    # Mondays 11:40 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt

      - name: Classify archive
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then python3 classify.py; else python3 classify.py --offline; fi

      - name: Append weekly snapshot
        run: python3 append_history.py

      - name: Feed health check (proposals only, human-gated)
        run: python3 discover_feeds.py --health-check || true

      - name: Verify (writes report; does not fail the job here)
        run: python3 verify_pipeline.py || echo "verify reported failures — see verification_report.json (build will be failed by the gate step)"

      - name: Commit derived data + proposals (always)
        if: always()
        run: |
          git config user.name "media-rollup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add items_classified.json media_history.json verification_report.json feeds_patch.json || true
          git commit -m "rollup $(date -u +%F)" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Gate — fail the build if verification reported any FAIL
        run: |
          python3 -c "import json,sys; r=json.load(open('verification_report.json')); n=r['summary'].get('FAIL',0); print('verification FAILs:', n); sys.exit(1 if n else 0)"
